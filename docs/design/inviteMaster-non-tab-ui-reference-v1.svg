<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="920" viewBox="0 0 1700 920">
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="softNoise">
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#292A25" flood-opacity="0.13"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#292A25" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="coverPine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173A37"/>
      <stop offset="1" stop-color="#102D2B"/>
    </linearGradient>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#EEE3CF"/>
    </linearGradient>
    <pattern id="microGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#C39445" stroke-opacity="0.20" stroke-width="1"/>
    </pattern>
    <style>
      .screen { fill:#F5F0E6; stroke:#173A37; stroke-width:2; }
      .paper { fill:#FBF8F1; }
      .ink { fill:#20211E; }
      .muted { fill:#5F625B; }
      .pine { fill:#2F4A46; }
      .deep-pine { fill:#173A37; }
      .red { fill:#B53B2E; }
      .gold { fill:#C39445; }
      .hair { stroke:#2F4A46; stroke-opacity:.22; stroke-width:1; }
      .gold-line { stroke:#C39445; stroke-width:1.5; fill:none; }
      .serif { font-family:'Source Han Serif SC','Songti SC','STSong',serif; }
      .sans { font-family:'Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .status { font:600 15px 'Source Han Sans SC','PingFang SC',sans-serif; fill:#20211E; }
      .nav { font:600 23px 'Source Han Serif SC','Songti SC',serif; fill:#20211E; letter-spacing:2px; }
      .h1 { font:600 30px 'Source Han Serif SC','Songti SC',serif; fill:#20211E; letter-spacing:2px; }
      .h2 { font:600 22px 'Source Han Serif SC','Songti SC',serif; fill:#20211E; letter-spacing:1px; }
      .body { font:15px 'Source Han Sans SC','PingFang SC',sans-serif; fill:#20211E; }
      .small { font:13px 'Source Han Sans SC','PingFang SC',sans-serif; fill:#5F625B; }
      .tiny { font:11px 'Source Han Sans SC','PingFang SC',sans-serif; fill:#5F625B; letter-spacing:.5px; }
      .kicker { font:11px 'Source Han Sans SC','PingFang SC',sans-serif; fill:#B53B2E; letter-spacing:3px; }
      .button { font:600 15px 'Source Han Sans SC','PingFang SC',sans-serif; }
    </style>
    <g id="status-icons" fill="none" stroke="#20211E" stroke-width="2" stroke-linecap="round">
      <path d="M0 11h3V8H0zm6 0h3V5H6zm6 0h3V2h-3z" fill="#20211E" stroke="none"/>
      <path d="M21 5c4-4 10-4 14 0M24 8c2.5-2.5 5.5-2.5 8 0M28 11h0"/>
      <rect x="42" y="1" width="23" height="11" rx="2"/>
