    </g>
    <g id="chevron" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2 1 6 6-6 6"/></g>
    <g id="share" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="4" cy="10" r="2"/><circle cx="14" cy="4" r="2"/><circle cx="14" cy="16" r="2"/><path d="m6 9 6-4M6 11l6 4"/></g>
    <g id="user" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="7" r="4"/><path d="M2 20c.8-5 3.5-7 8-7s7.2 2 8 7"/></g>
